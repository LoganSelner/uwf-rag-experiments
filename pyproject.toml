[project]
name = "uwf-rag-experiments"
version = "0.1.0"
description = "Reproducible RAG experiments for the UWF advising chatbot: baseline single-agent pipeline + RAGAS evaluation + retrieval ablations."
readme = "README.md"
authors = [
    { name = "LoganSelner", email = "loganselner@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "sentence-transformers>=3,<4",
    "pymupdf>=1.24",
    "bm25s>=0.2",                    # Sparse (BM25) lexical retrieval
    "PyStemmer>=2.2",                # Snowball stemmer used by bm25s tokenizer
    "ragas>=0.4,<0.5",              # Private API usage (_build_metric_map), pin to 0.4.x
    "datasets",                      # Transitive dep of RAGAS
    "python-dotenv>=1.0",
    "rich>=13",
    "langchain-text-splitters>=0.3",
    "langchain-community>=0.4,<1",   # ChatEdenAI LLM wrapper
    "langchain-ollama>=0.3",          # OllamaLLM (replaces deprecated langchain_community.llms.Ollama)
    "langchain-google-genai>=2.0",    # ChatGoogleGenerativeAI for evaluator LLM
    "tenacity>=8",
    "google-genai>=1.0",
    "chromadb>=0.5",
    "openai>=1.0",                    # OpenAI embeddings + generation (SDK direct)
    "langchain-openai>=0.3",          # OpenAI evaluator LLM (ChatOpenAI for RAGAS)
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uwf_rag"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["uwf_rag"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = '^tests/'
mypy_path = ["src"]
files = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragas", "ragas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_text_splitters", "langchain_text_splitters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_community", "langchain_community.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_ollama", "langchain_ollama.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_core", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dotenv", "dotenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.genai", "google.genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_google_genai", "langchain_google_genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_openai", "langchain_openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["Stemmer", "Stemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models or do heavy computation (deselect with '-m \"not slow\"')",
    "requires_api: marks tests that need external API access (Ollama, EdenAI)",
]
filterwarnings = [
    # FAISS SWIG bindings don't set __module__ on C extension types — upstream issue, nothing we can fix
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
