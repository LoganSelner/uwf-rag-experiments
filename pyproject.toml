[project]
name = "uwf-rag-experiments"
version = "0.1.0"
description = "Reproducible RAG experiments for the UWF advising chatbot: baseline single-agent pipeline + RAGAS evaluation + retrieval ablations."
readme = "README.md"
authors = [
    { name = "LoganSelner", email = "loganselner@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain-community>=0.4.1,<0.5",
    "langchain-chroma>=1.1.0,<2",
    "langchain-openai>=1.0.3,<2",
    "langchain-text-splitters>=1.1.0,<2",

    "pypdf>=6.7.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3,<0.5",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "sentence-transformers>=3.0.0,<4",
    "tenacity>=8.0.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pre-commit",
    "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
rag-test-index = "rag_testing.ingest:main"
rag-test-run = "rag_testing.run_pipeline:main"
rag-test-eval = "rag_testing.evaluate_ragas:main"
rag-test-compare = "rag_testing.compare_runs:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_testing"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["rag_testing"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = '^tests/'
mypy_path = ["src"]
files = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
