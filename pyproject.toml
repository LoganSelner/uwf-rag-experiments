[project]
name = "uwf-rag-experiments"
version = "0.1.0"
description = "Reproducible RAG experiments for the UWF advising chatbot: baseline single-agent pipeline + RAGAS evaluation + retrieval ablations."
readme = "README.md"
authors = [
    { name = "LoganSelner", email = "loganselner@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "faiss-cpu>=1.7",
    "numpy>=1.24",
    "sentence-transformers>=3,<4",
    "pymupdf>=1.24",
    "ragas>=0.4,<0.5",              # Private API usage (_build_metric_map), pin to 0.4.x
    "datasets",                      # Transitive dep of RAGAS
    "python-dotenv>=1.0",
    "rich>=13",
    "langchain-community>=0.4,<1",   # ChatEdenAI + Ollama LLM wrappers
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pre-commit",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/components", "src/pipeline", "src/evaluation"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "components", "pipeline", "evaluation"]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = '^tests/'
mypy_path = ["src"]
files = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragas", "ragas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_community", "langchain_community.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_core", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dotenv", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models or do heavy computation (deselect with '-m \"not slow\"')",
    "requires_api: marks tests that need external API access (Ollama, EdenAI)",
]
