# Smoke test — verify the pipeline works end-to-end without paid APIs.
#
# Changes from base.yaml:
#   - Indexing embedding: HuggingFace (local, free) instead of EdenAI
#   - Query generation: Ollama (local, free) instead of EdenAI
#   - Query transform: Ollama contextualizer instead of EdenAI contextualizer
#   - Evaluation mode: "none" — runs the pipeline against the dataset but
#     skips RAGAS scoring entirely. Per-sample query/response/contexts are
#     still written to run_1.jsonl so the output is inspectable.
#   - Local evaluator LLM/embedding overrides are retained as a record of
#     how to flip to a scored local run (set evaluation.mode: "full").
#   - Tiny 1-question dataset for quick sanity checks
#   - Single run (no statistical aggregation needed for a smoke test)
#   - Longer timeout and fewer workers for slower local inference
#
# Usage:
#   python scripts/run_experiment.py configs/smoke.yaml -v
#
# Notes:
#   - This is intentionally not comparable to formal experiments.
#   - It may download local models on first use.

extends: base.yaml

name: "smoke_test"
description: "Local smoke test: all-local stack, 1 question, 1 run"

indexing:
  embedding:
    type: "huggingface"
    params:
      model_name: "BAAI/bge-m3"

query:
  query_transform:
    params:
      generator_type: "ollama"
      # Change this if your Ollama server is not running on the default local port.
      base_url: "http://localhost:11434"
      llm:
        model_name: "qwen3:14b"
  generator:
    provider: "ollama"
    model_name: "qwen3:14b"
    params:
      # Change this if your Ollama server is not running on the default local port.
      base_url: "http://localhost:11434"

evaluation:
  dataset: "data/datasets/testKB_dataset.jsonl"
  mode: "none"
  num_runs: 1
  run_config:
    timeout: 1200
    max_workers: 1
  evaluator_llm:
    provider: "ollama"
    model_name: "qwen3:14b"
    params:
      # Change this if your Ollama server is not running on the default local port.
      base_url: "http://localhost:11434"
  evaluator_embedding:
    type: "huggingface"
    params:
      model_name: "BAAI/bge-m3"
