# Model/provider settings used by index, run, and evaluation commands.
# `backend` controls how credentials are handled:
# - edenai: routes through EdenAI using EDENAI_API_KEY (provider=openai)
# - openai: direct OpenAI client using OPENAI_API_KEY
llm:
  backend: edenai
  provider: openai
  model: gpt-4
  temperature: 0.0
  max_tokens: 1024
  api_key_env: EDENAI_API_KEY

embeddings:
  backend: edenai
  provider: openai
  model: text-embedding-3-small
  api_key_env: EDENAI_API_KEY
