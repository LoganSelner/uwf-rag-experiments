# Active experiment configuration.
# To run a different pipeline, copy one of configs/pipelines/*.yaml here
# (or edit the fields directly).
qa_path: data/queries/testKB_dataset.csv
runs_dir: runs

# Component selection — all three fields together define the run-directory name
# (e.g. "dense_none_stuff").
retriever_type: dense     # currently implemented: dense
reranker_type: none       # currently implemented: none
generator_type: stuff     # currently implemented: stuff

# Retrieval sizing.
# retrieval_k: how many docs to fetch from the vector store initially.
# top_k:       how many contexts to pass to the LLM after reranking.
# For no-reranker pipelines, set retrieval_k == top_k.
retrieval_k: 5
top_k: 5

# Reranker model — only used when reranker_type != "none".
# Example: cross-encoder/ms-marco-MiniLM-L-6-v2
reranker_model: ""

# Hybrid retrieval weight — only used when retriever_type == "hybrid" (future).
# 0.0 = BM25 only, 1.0 = dense only.
hybrid_alpha: 0.5

# MMR diversity parameter — only used when retriever_type == "mmr" (future).
# 0.0 = maximise diversity, 1.0 = maximise relevance.
mmr_lambda: 0.5

# Custom prompt template for the generator.
# Must contain {context} and {question} placeholders.
# Leave empty to use the component's built-in default.
prompt_template: ""

# Metric names consumed by evaluate_ragas.py.
# All available options (any subset can be enabled):
#
#   faithfulness          — are answers grounded in retrieved context? (no hallucination)
#   answer_relevancy      — is the answer relevant to the question?
#   answer_correctness    — is the answer correct vs. the reference? (semantic + factual)
#   answer_similarity     — embedding similarity between answer and reference
#   factual_correctness   — NLI-based factual claim verification against reference
#   context_precision     — are relevant chunks ranked at the top of retrieval?
#   context_recall        — does retrieved context cover the reference answer?
#   context_entity_recall — are named entities from the reference present in context?
#                           (valuable for entity-dense content: course codes, deadlines)
# Per-metric timeout (seconds) for RAGAS evaluate().
# Composite metrics like answer_correctness need more time than the default 180s.
ragas_timeout: 300

metrics:
  - faithfulness
  - answer_relevancy
  - answer_correctness
  - context_precision
  - context_entity_recall
