# Pipeline: naive_rag
# Dense semantic retrieval, no reranking, stuff generator.
# Baseline configuration — all other pipelines should be compared against this.
#
# Run name suffix: dense_none_stuff
# Usage: copy this file to configs/eval.yaml to make it active.
qa_path: data/queries/testKB_dataset.csv
runs_dir: runs

retriever_type: dense
reranker_type: none
generator_type: stuff

# No reranker — retrieval_k == top_k (fetch exactly what the LLM will see).
retrieval_k: 3
top_k: 3

reranker_model: ""
hybrid_alpha: 0.5
mmr_lambda: 0.5
prompt_template: ""

metrics:
  - faithfulness
  - answer_relevancy
  - answer_correctness
  - context_precision
  - context_entity_recall
