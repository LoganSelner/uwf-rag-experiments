# Pipeline: mmr_rag
# MMR retrieval (relevance + diversity), no reranking, stuff generator.
#
# Run name suffix: mmr_none_stuff
# Usage: copy this file to configs/eval.yaml to make it active.
qa_path: data/queries/testKB_dataset.csv
runs_dir: runs

retriever_type: mmr
reranker_type: none
generator_type: stuff

# No reranker — retrieval_k == top_k (fetch exactly what the LLM will see).
# MMR internally fetches a larger pool (fetch_k = max(20, 4 * retrieval_k))
# and selects retrieval_k diverse results from it.
retrieval_k: 3
top_k: 3

reranker_model: ""
hybrid_alpha: 0.5
# MMR diversity parameter: 0.0 = maximise diversity, 1.0 = maximise relevance.
mmr_lambda: 0.5
prompt_template: ""

metrics:
  - faithfulness
  - answer_relevancy
  - answer_correctness
  - context_precision
  - context_entity_recall
