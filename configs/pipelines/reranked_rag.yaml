# Pipeline: reranked_rag
# Dense retrieval with cross-encoder reranking, stuff generator.
# Fetch a larger candidate set (retrieval_k=20), rerank, then pass top_k=3 to LLM.
#
# Run name suffix: dense_cross_encoder_stuff
# Usage: copy this file to configs/eval.yaml to make it active.
qa_path: data/queries/testKB_dataset.csv
runs_dir: runs

retriever_type: dense
reranker_type: cross_encoder
generator_type: stuff

# Fetch 20 candidates; reranker selects the best 3 for generation.
retrieval_k: 20
top_k: 3

# Cross-encoder model for reranking.
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
hybrid_alpha: 0.5
mmr_lambda: 0.5
mmr_fetch_k: 20
prompt_template: ""

metrics:
  - faithfulness
  - answer_relevancy
  - answer_correctness
  - context_precision
  - context_entity_recall
