# Cross-encoder reranking with a tighter final context.
#
# Reranks the baseline's 10-candidate pool but keeps only 3 chunks
# (vs. the baseline's 5). Tests whether a tighter, higher-precision
# final context helps after reranking.
#
# Variables changed vs baseline: reranking (none → cross_encoder),
# top_k_final (5 → 3); top_k_retrieve stays at the baseline's 10.
# Compare against: reranker_cross_encoder (10/5) — isolates top_k_final.

extends: ../../base.yaml

name: "reranker_cross_encoder_topk_3"
description: "Cross-encoder reranking with top_k_retrieve=10, top_k_final=3"

query:
  retrieval:
    type: "dense"
    top_k_retrieve: 10
    top_k_final: 3

  reranking:
    type: "cross_encoder"
    params:
      model_name: "Alibaba-NLP/gte-reranker-modernbert-base"
