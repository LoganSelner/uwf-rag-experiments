# Cross-encoder reranking with a deeper candidate pool.
#
# Doubles the baseline's candidate pool (10 → 20) while keeping the
# baseline's final context of 5. Tests whether giving the reranker more
# candidates to choose from improves precision at a fixed context size.
# (With the deeper 10/5 baseline, a 10→5 variant would just be the
# baseline reranker — reranker_cross_encoder — so this varies the pool.)
#
# Variables changed vs baseline: reranking (none → cross_encoder),
# top_k_retrieve (10 → 20); top_k_final stays at the baseline's 5.
# Compare against: reranker_cross_encoder (10/5) — isolates pool depth.

extends: ../../base.yaml

name: "reranker_cross_encoder_topk_5"
description: "Cross-encoder reranking with top_k_retrieve=20, top_k_final=5"

query:
  retrieval:
    type: "dense"
    top_k_retrieve: 20
    top_k_final: 5

  reranking:
    type: "cross_encoder"
    params:
      model_name: "Alibaba-NLP/gte-reranker-modernbert-base"
