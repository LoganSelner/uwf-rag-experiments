# Cross-encoder reranking with a high-recall setting.
#
# Retrieves 20 candidates and keeps 10 after reranking — an
# exploratory upper-bound that widens both the candidate pool and the
# final context beyond the 10/5 baseline.
#
# Variables changed vs baseline: reranking (none → cross_encoder),
# top_k_retrieve (10 → 20), top_k_final (5 → 10)
# Compare against: reranker_cross_encoder_topk_5 (20/5) — isolates top_k_final.

extends: ../../base.yaml

name: "reranker_cross_encoder_topk_10"
description: "Cross-encoder reranking with top_k_retrieve=20, top_k_final=10"

query:
  retrieval:
    type: "dense"
    top_k_retrieve: 20
    top_k_final: 10

  reranking:
    type: "cross_encoder"
    params:
      model_name: "Alibaba-NLP/gte-reranker-modernbert-base"
