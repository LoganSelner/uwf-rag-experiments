# Strongest all-local variant.
#
# Combines the custom chunker, Chroma, and contextualized query rewriting
# while keeping generation and evaluation fixed to qwen3:14b.

extends: ../base.yaml

name: "recursive_custom_chroma_contextualizer"
description: "Custom chunking + Chroma + qwen3:14b contextualizer"

indexing:
  chunking:
    type: "recursive_custom"
    params:
      chunk_size: 512
      chunk_overlap: 50
      separators: ["\n\n", "\n", ". ", " ", ""]

  vectorstore:
    type: "chroma"
    params:
      metric: "cosine"
      collection_name: "uwf_custom_chunks"

query:
  query_transform:
    type: "contextualizer"
    params:
      generator_type: "ollama"
      llm:
        model_name: "qwen3:14b"
        temperature: 0.0
