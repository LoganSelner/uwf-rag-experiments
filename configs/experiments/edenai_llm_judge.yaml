extends: ../base.yaml

name: "edenai_llm_judge"
description: "Baseline retrieval stack with Eden AI generation and evaluation"

query:
  generation:
    type: "edenai"
    params:
      sub_provider: "openai"

  generation_llm:
    provider: "edenai"
    model_name: "gpt-4"
    temperature: 0.0
    max_tokens: 1024

evaluation:
  num_runs: 3
  evaluator_llm:
    provider: "edenai"
    model_name: "gpt-4"
