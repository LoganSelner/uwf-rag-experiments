# Eden AI generation baseline.
#
# Keeps the local indexing / retrieval baseline from base.yaml, swaps only the
# answer generator to Eden AI, and keeps the evaluator fixed to local
# qwen3:32b for fairer cross-experiment comparisons.
#
# Prerequisites:
#   1. Set EDENAI_API_KEY in .env or your shell environment
#
# Usage:
#   python scripts/run_experiment.py configs/experiments/edenai_baseline.yaml -v

extends: ../base.yaml

name: "edenai_baseline"
description: "Baseline retrieval stack with Eden AI generation and qwen3:32b evaluation"

query:
  generation:
    type: "edenai"
    params:
      sub_provider: "openai"

  generation_llm:
    provider: "edenai"
    model_name: "gpt-4"
    temperature: 0.0
    max_tokens: 1024
