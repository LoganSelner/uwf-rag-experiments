# Cross-encoder reranking with Chroma vectorstore.
#
# Combines cross-encoder reranking with the Chroma backend.
# Compare against reranker_cross_encoder (FAISS) to test
# reranking effect across different vectorstore backends.

extends: ../formal_eval_base.yaml

name: "reranker_cross_encoder_chroma"
description: "Cross-encoder reranking with Chroma vectorstore"

indexing:
  vectorstore:
    type: "chroma"
    params:
      metric: "cosine"
      collection_name: "uwf_hf_chunks"

query:
  reranking:
    type: "cross_encoder"
    params:
      model_name: "Alibaba-NLP/gte-reranker-modernbert-base"
