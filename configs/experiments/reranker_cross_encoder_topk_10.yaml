# Cross-encoder reranking with wider candidate pool.
#
# Retrieves 20 candidates and reranks down to 10. Tests whether a
# larger retrieval pool gives the cross-encoder more to work with,
# improving final context quality.

extends: ../formal_eval_base.yaml

name: "reranker_cross_encoder_topk_10"
description: "Cross-encoder reranking with top_k_retrieve=20, top_k_final=10"

query:
  retrieval:
    type: "dense"
    top_k_retrieve: 20
    top_k_final: 10

  reranking:
    type: "cross_encoder"
    params:
      model_name: "Alibaba-NLP/gte-reranker-modernbert-base"
