# Retrieval-only Chroma comparison.
#
# Matches the local baseline except for the vector store, making it useful for
# isolated FAISS vs Chroma retrieval comparisons.

extends: ../base.yaml

name: "retrieval_only_hf_chroma"
description: "Retrieval-only evaluation for HuggingFace embeddings with Chroma"

indexing:
  vectorstore:
    type: "chroma"
    params:
      metric: "cosine"
      collection_name: "uwf_hf_chunks"

query:
  generation:
    type: ""

  generation_llm:
    provider: ""
    model_name: ""
    temperature: 0.0

evaluation:
  mode: "retrieval_only"
