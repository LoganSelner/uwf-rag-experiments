# Chunk-size sweep: 512-char recursive chunks (vs base.yaml's 1000).
#
# Isolates chunk SIZE on the recursive chunker.
#
# Variables changed from base.yaml:
#   - indexing.chunking.params.chunk_size:   1000 -> 512
#   - indexing.chunking.params.chunk_overlap: 100 -> 50
# (type + separators inherited from base; distinct fingerprint => one rebuild.)
#
# Compare against: chunk_size_256, chunk_size_1024, base.yaml (1000).

extends: ../../base.yaml

name: "chunk_size_512"
description: "Recursive chunking at 512 chars (overlap 50)"

indexing:
  chunking:
    params:
      chunk_size: 512
      chunk_overlap: 50
