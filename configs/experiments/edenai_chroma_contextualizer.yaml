# Eden AI + Chroma + contextualizer stack.
#
# Extends the Eden AI baseline with:
#   - Chroma vector storage
#   - contextualizer query rewriting
#
# Query-time generation stays fully Eden AI-backed for consistency, while the
# evaluator remains fixed to local qwen3:14b via the inherited baseline config.
#
# Prerequisites:
#   1. Set EDENAI_API_KEY in .env or your shell environment
#
# Usage:
#   python scripts/run_experiment.py configs/experiments/edenai_chroma_contextualizer.yaml -v

extends: edenai_baseline.yaml

name: "edenai_chroma_contextualizer"
description: "Eden AI generation + Chroma + Eden AI contextualizer"

indexing:
  vectorstore:
    type: "chroma"
    params:
      metric: "cosine"
      collection_name: "uwf_hf_chunks"

query:
  query_transform:
    type: "contextualizer"
    params:
      generator_type: "edenai"
      sub_provider: "openai"
      llm:
        model_name: "gpt-4"
        temperature: 0.0
