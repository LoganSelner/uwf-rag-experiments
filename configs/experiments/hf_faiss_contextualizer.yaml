# Local contextualizer ablation.
#
# Keeps the baseline index stack and adds the contextualizer so you can measure
# the value of query rewriting independently of Chroma or alternative chunking.

extends: ../base.yaml

name: "hf_faiss_contextualizer"
description: "Local baseline plus qwen3:32b contextualizer query transform"

query:
  query_transform:
    type: "contextualizer"
    params:
      generator_type: "ollama"
      llm:
        model_name: "qwen3:32b"
        temperature: 0.0
