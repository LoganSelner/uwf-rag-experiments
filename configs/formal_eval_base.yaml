# Formal evaluation base config.
#
# Extends the local baseline and overrides only the evaluator stack
# to use GPT-4.1 via EdenAI as the LLM judge and text-embedding-3-small
# via EdenAI as the evaluation embedding.
#
# Experiment configs for formal/publishable runs should extend this
# file instead of base.yaml directly. Ollama remains in base.yaml
# for local development and smoke testing.

extends: base.yaml

evaluation:
  evaluator_llm:
    provider: "edenai"
    model_name: "gpt-4.1"
    params:
      sub_provider: "openai"
  evaluator_embedding:
    type: "edenai"
    params:
      provider: "openai"
      model_name: "text-embedding-3-small"
