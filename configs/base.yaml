# Base experiment config — all experiments inherit from this.
#
# Pipeline defaults:
#   - LangChain recursive chunking (1000 tokens, 100 overlap)
#   - text-embedding-3-small embeddings via EdenAI (OpenAI sub-provider)
#   - Chroma vector store (cosine)
#   - Dense retrieval (top_k_retrieve=10, top_k_final=5)
#   - No reranking
#   - Passthrough query transform (single-turn eval has no history to
#     contextualize; the contextualizer is a conversational component, so it is
#     a no-op here — switch it on only once multi-turn evaluation lands)
#   - EdenAI GPT-4.1 generation (OpenAI sub-provider)
#
# Evaluation defaults (formal):
#   - GPT-4.1 via EdenAI as LLM judge
#   - text-embedding-3-small via EdenAI as evaluation embedding
#   - 3 runs for statistical significance
#
# Experiment configs extend this and override only the variable being tested.
# For local smoke testing, use configs/smoke.yaml instead.

name: "baseline"
description: "Local baseline: text-embedding-3-small (EdenAI) + Chroma + EdenAI GPT-4.1, formal eval"
pipeline_mode: "linear"

indexing:
  sources:
    - name: "knowledge_base"
      path: "data/sources/knowledge_base.pdf"
      ingest:
        type: "pdf"

  chunking:
    type: "recursive_langchain"
    params:
      chunk_size: 1000
      chunk_overlap: 100
      separators: ["\n\n", "\n", ".", " ", ""]

  embedding:
    type: "edenai"
    params:
      provider: "openai"
      model_name: "text-embedding-3-small"

  vectorstore:
    type: "chroma"
    params:
      metric: "cosine"

query:
  # Passthrough by default: the evaluator runs single-turn (no conversation
  # history), so the history-dependent contextualizer would be a no-op. An
  # experiment that wants query rewriting overrides query.query_transform.type
  # (e.g. hyde, multi_query) and supplies its own generator.
  query_transform:
    type: "passthrough"

  retrieval:
    type: "dense"
    top_k_retrieve: 10
    top_k_final: 5

  reranking:
    type: "none"

  generator:
    provider: "edenai"
    model_name: "gpt-4.1"
    temperature: 0.0
    max_tokens: 1024
    params:
      sub_provider: "openai"

  prompt:
    type: "chat"
    system_template: |
      You are an assistant for question-answering tasks.
      Use the following pieces of retrieved context to answer the question.
      If you don't know the answer, say so concisely.
    context_format: "plain"
    use_chain_of_thought: false
    citation_style: "none"

evaluation:
  dataset: "data/datasets/25qKB_dataset.jsonl"
  mode: "full"
  metrics:
    - "answer_correctness"
    - "context_precision"
    - "faithfulness"
    - "context_entity_recall"
    - "answer_relevancy"
  retrieval_only_metrics:
    - "context_precision"
    - "context_entity_recall"
  num_runs: 3
  run_config:
    timeout: 300
    max_retries: 10
    max_wait: 60
    max_workers: 4
  evaluator_llm:
    provider: "edenai"
    model_name: "gpt-4.1"
    temperature: 0.0
    params:
      sub_provider: "openai"
  evaluator_embedding:
    type: "edenai"
    params:
      provider: "openai"
      model_name: "text-embedding-3-small"
